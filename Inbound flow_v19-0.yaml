inboundCall:
  name: Test
  description: ""
  division: Home
  startUpRef: "/inboundCall/tasks/task[New Task 1_14]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
      textToSpeech:
        defaultEngine:
          voice: Jill
  initialGreeting:
    tts: Hello, this is the initial greeting.
  variables:
    - stringVariable:
        name: Flow.capital
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.dbresponse
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.name
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.qoute
        initialValue:
          noValue: true
    - integerVariable:
        name: Flow.status
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.Userid
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.UserPresence
        initialValue:
          noValue: true
    - decimalVariable:
        name: Flow.year
        initialValue:
          noValue: true
  settingsActionDefaults:
    playAudioOnSilence:
      allowedRepeatCount:
        lit: 5
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    detectSilence:
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    callData:
      processingPrompt:
        noValue: true
    collectInput:
      interDigitTimeout:
        lit:
          seconds: 3
      noEntryTimeout:
        lit:
          seconds: 5
    dialByExtension:
      interDigitTimeout:
        lit:
          seconds: 6
    transferToUser:
      connectTimeout:
        noValue: true
    transferToNumber:
      connectTimeout:
        noValue: true
    transferToGroup:
      connectTimeout:
        noValue: true
    transferToFlowSecure:
      connectTimeout:
        lit:
          seconds: 15
  settingsErrorHandling:
    errorHandling:
      queue:
        targetQueue:
          lit:
            name: CTI
    preHandlingAudio:
      tts: "Sorry, an error javascript:void(0)occurred. Please try your call again."
  settingsMenu:
    extensionDialingMaxDelay:
      lit:
        seconds: 1
    listenForExtensionDialing:
      lit: true
    menuSelectionTimeout:
      lit:
        seconds: 10
    repeatCount:
      lit: 3
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  settingsSpeechRec:
    completeMatchTimeout:
      lit:
        ms: 100
    incompleteMatchTimeout:
      lit:
        ms: 1500
    maxSpeechLengthTimeout:
      lit:
        seconds: 20
    minConfidenceLevel:
      lit: 50
    asrCompanyDir: none
    asrEnabledOnFlow: true
    suppressRecording: true
  menus:
    - menu:
        name: Open hours menu
        refId: Open hours menu_26
        trackingId: 26
        audio:
          tts: Press 1 for sales. Press 2 for Promotions
        settingsMenu:
          extensionDialingMaxDelay:
            noValue: true
          listenForExtensionDialing:
            noValue: true
          menuSelectionTimeout:
            noValue: true
          repeatCount:
            noValue: true
        settingsSpeechRec:
          completeMatchTimeout:
            noValue: true
          incompleteMatchTimeout:
            noValue: true
          maxSpeechLengthTimeout:
            noValue: true
          minConfidenceLevel:
            noValue: true
        choices:
          - menuTask:
              name: Sales
              trackingId: 27
              dtmf: digit_1
              globalDtmf: false
              globalSpeechRecTerms: false
              task:
                trackingId: 28
                actions:
                  - transferToAcd:
                      name: Transfer to ACD
                      trackingId: 31
                      targetQueue:
                        lit:
                          name: Sales
                      overrideInQueueFlow:
                        name: InQueueCallback
                      preTransferAudio:
                        exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                      failureTransferAudio:
                        exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                      priority:
                        lit: 0
                      preferredAgents:
                        noValue: true
                      languageSkill:
                        noValue: true
                      directAgent:
                        noValue: true
                      failureOutputs:
                        errorType:
                          noValue: true
                        errorMessage:
                          noValue: true
                      skillExpressionFilters:
                        noValue: true
                  - jumpToTask:
                      name: Jump to Reusable Task
                      trackingId: 40
                      targetTaskRef: "/inboundCall/tasks/task[Voice mail_33]"
          - menuTask:
              name: Promotion
              trackingId: 29
              dtmf: digit_2
              globalDtmf: false
              globalSpeechRecTerms: false
              task:
                trackingId: 30
                actions:
                  - transferToAcd:
                      name: Transfer to ACD
                      trackingId: 32
                      targetQueue:
                        lit:
                          name: Promotion
                      preTransferAudio:
                        exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                      failureTransferAudio:
                        exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                      priority:
                        lit: 0
                      preferredAgents:
                        noValue: true
                      languageSkill:
                        noValue: true
                      directAgent:
                        noValue: true
                      failureOutputs:
                        errorType:
                          noValue: true
                        errorMessage:
                          noValue: true
                      skillExpressionFilters:
                        noValue: true
                  - jumpToTask:
                      name: Jump to Reusable Task
                      trackingId: 39
                      targetTaskRef: "/inboundCall/tasks/task[Voice mail_33]"
    - menu:
        name: Closed hours menu
        refId: Closed hours menu_42
        trackingId: 42
        audio:
          tts: Press 1 for support, Press 2 for agent
        settingsMenu:
          extensionDialingMaxDelay:
            noValue: true
          listenForExtensionDialing:
            noValue: true
          menuSelectionTimeout:
            noValue: true
          repeatCount:
            noValue: true
        settingsSpeechRec:
          completeMatchTimeout:
            noValue: true
          incompleteMatchTimeout:
            noValue: true
          maxSpeechLengthTimeout:
            noValue: true
          minConfidenceLevel:
            noValue: true
        choices:
          - menuTask:
              name: New Task 3
              trackingId: 43
              dtmf: digit_1
              globalDtmf: false
              globalSpeechRecTerms: false
              task:
                trackingId: 44
                actions:
                  - jumpToTask:
                      name: Jump to Reusable Task
                      trackingId: 45
                      targetTaskRef: "/inboundCall/tasks/task[Voice mail_33]"
          - menuTask:
              name: New Task 4
              trackingId: 46
              dtmf: digit_2
              globalDtmf: false
              globalSpeechRecTerms: false
              task:
                trackingId: 47
                actions:
                  - jumpToTask:
                      name: Jump to Reusable Task
                      trackingId: 48
                      targetTaskRef: "/inboundCall/tasks/task[Voice mail_33]"
  tasks:
    - task:
        name: New Task 1
        refId: New Task 1_14
        trackingId: 14
        variables:
          - stringVariable:
              name: Task.Language
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.Status
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - setParticipantData:
              name: Set Participant Data
              trackingId: 70
              attributes:
                - attribute:
                    name:
                      lit: Status
                    value:
                      lit: "\"Call Start\""
          - callData:
              name: Call Data Action
              trackingId: 58
              processingPrompt:
                noValue: true
              timeout:
                lit:
                  minutes: 1
              category:
                Web Services Data Actions:
                  dataAction:
                    countrycode:
                      inputs:
                        callingcode:
                          exp: "\"92\""
                      successOutputs:
                        name:
                          var: Flow.name
                        capital:
                          var: Flow.capital
                        region:
                          noValue: true
                        subregion:
                          noValue: true
                        alpha2Code:
                          noValue: true
                        alpha3Code:
                          noValue: true
                        population:
                          noValue: true
                        area:
                          noValue: true
                        demonym:
                          noValue: true
                        callingCode:
                          noValue: true
                        currencyCode:
                          noValue: true
                        currencyName:
                          noValue: true
                        currencySymbol:
                          noValue: true
                        timezone:
                          noValue: true
                        topLevelDomain:
                          noValue: true
                        flagPng:
                          noValue: true
                        flagSvg:
                          noValue: true
                        languages:
                          noValue: true
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          var: Flow.status
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true
              outputs:
                success:
                  actions:
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 64
                        attributes:
                          - attribute:
                              name:
                                lit: API response
                              value:
                                lit: Flow.status
                    - playAudio:
                        name: Play Audio
                        trackingId: 60
                        audio:
                          exp: AudioPlaybackOptions(Append(ToAudioTTS("You are calling from"), ToAudioTTS(Flow.name), ToAudioTTS("whose capital is"), ToAudioTTS(Flow.capital)), true)
                failure:
                  actions:
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 65
                        attributes:
                          - attribute:
                              name:
                                lit: API response
                              value:
                                lit: Flow.status
                    - playAudio:
                        name: Play Audio
                        trackingId: 59
                        audio:
                          tts: API Failure
                timeout:
                  actions:
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 66
                        attributes:
                          - attribute:
                              name:
                                lit: API response
                              value:
                                lit: Flow.status
          - dataTableLookup:
              name: Data Table Lookup
              trackingId: 55
              lookupValue:
                exp: "\"03405128160\""
              dataTable:
                Blocked number:
                  foundOutputs:
                    Language:
                      var: Task.Language
                    Status:
                      var: Task.Status
                  failureOutputs:
                    errorType:
                      var: Flow.dbresponse
                    errorMessage:
                      noValue: true
              outputs:
                found:
                  actions:
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 67
                        attributes:
                          - attribute:
                              name:
                                lit: Db status
                              value:
                                lit: "\"Number found\""
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 68
                        attributes:
                          - attribute:
                              name:
                                lit: API response
                              value:
                                lit: Flow.status
                    - playAudio:
                        name: Play Audio
                        trackingId: 56
                        audio:
                          exp: AudioPlaybackOptions(Append(ToAudioTTS("Your language is "), ToAudioTTS(Task.Language), ToAudioTTS("Your status is"), ToAudioTTS(Task.Status)), true)
                    - setScreenPop:
                        name: Set Screen Pop
                        trackingId: 76
                        screenPopScript:
                          w:
                            inputs:
                              Variable 1:
                                lit: "\"Variable 1 from Script\""
                              Variable 2:
                                lit: "\"Variable 3 from Script\""
                              Variable 3:
                                lit: "\"Variable 3 from Script\""
                    - transferToAcd:
                        name: Transfer to ACD
                        trackingId: 75
                        targetQueue:
                          lit:
                            name: Sales
                        priority:
                          lit: 0
                        preferredAgents:
                          noValue: true
                        languageSkill:
                          noValue: true
                        directAgent:
                          noValue: true
                        failureOutputs:
                          errorType:
                            noValue: true
                          errorMessage:
                            noValue: true
                        skillExpressionFilters:
                          noValue: true
                notFound:
                  actions:
                    - setParticipantData:
                        name: Set Participant Data
                        trackingId: 69
                        attributes:
                          - attribute:
                              name:
                                lit: Db error
                              value:
                                lit: Flow.dbresponse
                    - playAudio:
                        name: Play Audio
                        trackingId: 57
                        audio:
                          tts: number not found
          - callTask:
              name: Call Task
              trackingId: 25
              targetTaskRef: "/inboundCall/tasks/task[New Task 2_18]"
              outputs:
                default:
                  actions:
                    - jumpToMenu:
                        name: Jump to Menu
                        trackingId: 74
                        targetMenuRef: "/inboundCall/menus/menu[Open hours menu_26]"
                paths:
                  - path:
                      name: Closed
                      actions:
                        - jumpToMenu:
                            name: Jump to Menu
                            trackingId: 71
                            targetMenuRef: "/inboundCall/menus/menu[Open hours menu_26]"
                  - path:
                      name: Open
                      actions:
                        - jumpToMenu:
                            name: Jump to Menu
                            trackingId: 41
                            targetMenuRef: "/inboundCall/menus/menu[Open hours menu_26]"
                  - path:
                      name: Emergency
                      actions:
                        - jumpToMenu:
                            name: Jump to Menu
                            trackingId: 73
                            targetMenuRef: "/inboundCall/menus/menu[Open hours menu_26]"
          - jumpToMenu:
              name: Jump to Menu
              trackingId: 50
              targetMenuRef: "/inboundCall/menus/menu[Open hours menu_26]"
    - task:
        name: New Task 2
        refId: New Task 2_18
        trackingId: 18
        actions:
          - evaluateScheduleGroup:
              name: Evaluate Schedule Group
              trackingId: 20
              inServiceSchedules:
                noValue: true
              evaluate:
                now: true
              scheduleGroup:
                lit:
                  name: EFSG
                name: EFSG
              emergencyGroup:
                noValue: true
              outputs:
                open:
                  actions:
                    - endTask:
                        name: End Task
                        trackingId: 23
                        outputPath:
                          name: Open
                closed:
                  actions:
                    - endTask:
                        name: End Task
                        trackingId: 22
                        outputPath:
                          name: Closed
                holiday:
                  actions:
                    - endTask:
                        name: End Task
                        trackingId: 21
                        outputPath:
                          name: Holiday
                emergency:
                  actions:
                    - endTask:
                        name: End Task
                        trackingId: 24
                        outputPath:
                          name: Emergency
        outputPaths:
          - outputPath:
              name: Closed
          - outputPath:
              name: Open
          - outputPath:
              name: Holiday
          - outputPath:
              name: Emergency
    - task:
        name: Voice mail
        refId: Voice mail_33
        trackingId: 33
        actions:
          - callData:
              name: Call Data Action
              trackingId: 51
              processingPrompt:
                noValue: true
              timeout:
                lit:
                  minutes: 1
              category:
                Genesys Cloud Data Actions:
                  dataAction:
                    Get User ID by Extension:
                      inputs:
                        userExtension:
                          lit: "0002"
                      successOutputs:
                        id:
                          var: Flow.Userid
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          noValue: true
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true
              outputs:
                success:
                  actions:
                    - callData:
                        name: Call Data Action
                        trackingId: 52
                        processingPrompt:
                          noValue: true
                        timeout:
                          lit:
                            minutes: 1
                        category:
                          Genesys Cloud Data Actions:
                            dataAction:
                              Get User Presence:
                                inputs:
                                  USER_ID:
                                    lit: "\"Flow.Userid\""
                                successOutputs:
                                  presence:
                                    var: Flow.UserPresence
                                failureOutputs:
                                  errorCode:
                                    noValue: true
                                  status:
                                    noValue: true
                                  correlationId:
                                    noValue: true
                                  entityId:
                                    noValue: true
                                  entityName:
                                    noValue: true
                                  userMessage:
                                    noValue: true
                                  userParamsMessage:
                                    noValue: true
                                  userParams.key:
                                    noValue: true
                                  userParams.value:
                                    noValue: true
                                  details.errorCode:
                                    noValue: true
                                  details.fieldName:
                                    noValue: true
                                  details.entityId:
                                    noValue: true
                                  details.entityName:
                                    noValue: true
                        outputs:
                          success:
                            actions:
                              - decision:
                                  name: Decision
                                  trackingId: 53
                                  condition:
                                    exp: "\"Flow.UserPresence==Offline\""
                                  outputs:
                                    "no":
                                      actions:
                                        - transferToUser:
                                            name: Transfer to User
                                            trackingId: 54
                                            targetUser:
                                              lit:
                                                userName: zeeshan.ali@expertflow.com
                                            allowVoicemailRollover:
                                              lit: true
                                            preTransferAudio:
                                              exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                                            failureTransferAudio:
                                              exp: AudioPlaybackOptions(ToAudioBlank(500), true)
                                            connectTimeout:
                                              noValue: true
                                            failureOutputs:
                                              errorType:
                                                noValue: true
                                              errorMessage:
                                                noValue: true
          - playAudio:
              name: Play Audio
              trackingId: 34
              audio:
                tts: Sorry, an error has occured. Please leave a message.Our team will get in touch with you.
          - transferToVoicemail:
              name: Transfer to Voicemail
              trackingId: 35
              destination:
                queue:
                  targetQueue:
                    lit:
                      name: Test Queue
                  callbackNumber:
                    exp: ToPhoneNumber(Call.Ani)
                  calleeName:
                    noValue: true
                  voicemailGreeting:
                    prompt: PromptSystem.voicemail_greeting
              preTransferAudio:
                exp: AudioPlaybackOptions(ToAudioBlank(500), true)
              failureTransferAudio:
                exp: AudioPlaybackOptions(ToAudioBlank(500), true)
              failureOutputs:
                errorType:
                  noValue: true
                errorMessage:
                  noValue: true
          - disconnect:
              name: Disconnect
              trackingId: 36
  referencedObjects:
    flows:
      - flow:
          name: InQueueCallback
          type: inqueuecall
          defaultLanguage: en-us
          variables: []
